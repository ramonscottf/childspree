<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1B3A4B" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Child Spree 2026 — Davis Education Foundation</title>
    <meta name="description" content="Nominate a child for Child Spree 2026. Davis Education Foundation provides back-to-school clothing for students in need across Davis County." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'DM Sans', sans-serif; background: #F8FAFC; -webkit-font-smoothing: antialiased; }
    </style>
    <script>
      // Path-to-hash bridge for shareable deep links.
      // The SPA uses hash routing (#/intake/TOKEN), but path-based links
      // (/intake/TOKEN) are easier to share via email/SMS without getting
      // mangled. Convert known UI paths to hash form before React mounts.
      (function () {
        try {
          var p = window.location.pathname;
          if (p === '/' || p === '') return;
          // UI routes that should be deep-linkable via path. Anything not
          // matched here falls through to the default SPA fallback (home).
          var routes = [
            /^\/(intake)\/([^\/]+)\/?$/,
            /^\/(v)\/([^\/]+)\/?$/,
            /^\/(bag)\/([^\/]+)\/?$/,
            /^\/(shop)\/([^\/]+)\/?$/,
            /^\/(fa)\/([^\/]+)(?:\/(video)\/([^\/]+))?\/?$/,
            /^\/(nominate|volunteer|portal|admin)\/?$/
          ];
          for (var i = 0; i < routes.length; i++) {
            var m = p.match(routes[i]);
            if (!m) continue;
            // Reconstruct the hash from the matched path segments.
            var hash = '#/' + m.slice(1).filter(Boolean).join('/');
            window.history.replaceState(null, '', '/' + (window.location.search || '') + hash);
            return;
          }
        } catch (e) { /* fall through to normal SPA boot */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
